<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brain and Skull Atlas</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  </head>
  <body>
    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Anatomical Orientation Cube Container -->
    <div id="orientation-cube-container"></div>

    <!-- Initial Loading Overlay -->
    <div id="loading-overlay">
      <div class="loading-content">
        <div class="loading-spinner"></div>
        <div class="loading-title">Brain and Skull Atlas</div>
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="loading-status" id="loading-status">Connecting to neuroimaging server...</div>
      </div>
    </div>

    <!-- Application Script -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
